name: Fix Supabase key
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Supabase anon key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmNubGpha3FycXpvY2FoeGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MzgzNzgsImV4cCI6MjEwMjUxNDM3OH0.CmmWLFgnXzR8ocOz1CQFw5b6WtcP1fsO7r324F25-5Y'
          import re
          s=re.sub(r"const SUPABASE_ANON_KEY='[^']*'", "const SUPABASE_ANON_KEY='"+key+"'", s, count=1)
          p.write_text(s)
          PY
      - name: Commit corrected key
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Supabase anon key'
          git push
